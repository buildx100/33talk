# Static files, plus a same-origin /v1 proxy to llama-server.
#
# Same origin is the whole point: the browser never makes a cross-origin
# request, so CORS never enters the picture and there is no backend code to
# write. See compose.yml.

server {
    listen 16001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # OpenAI-compatible API, served by llama-server.
    location /v1/ {
        proxy_pass         http://llm:16002/v1/;
        proxy_http_version 1.1;

        # Streaming: buffering here would defeat the point, though at 10
        # characters per second the paper is a far tighter bottleneck than
        # the network ever will be.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection '';
        proxy_set_header   Host $host;

        # A 0.6B model on a small CPU box is not fast to first token.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
