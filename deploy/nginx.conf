# Static files, plus a same-origin /v1 proxy to llama-server.
#
# Same origin is the whole point: the browser never makes a cross-origin
# request, so CORS never enters the picture and there is no backend code to
# write. See compose.yml.
#
# THE /v1 PROXY IS PUBLIC BY NECESSITY. The client is a browser, so the
# request originates on the user's machine and travels the internet like any
# other. There is no way for the server to tell the page's own call apart
# from a hand-written one -- headers and Origin are equally forgeable, and a
# token shipped to the browser is a token anyone can read. What can be done
# is to make abuse cheap to survive: expose as few endpoints as possible,
# throttle them, and bound how much work one request can ask for.

# limit_req_zone belongs to the http context, which is where conf.d/*.conf
# is included.
#
# 20 requests per minute per address. The number comes from the machine: the
# paper prints at ten characters per second, so a reply takes 5-20 seconds
# to appear and a real person cannot submit more than about six lines a
# minute. This leaves roughly three times the human ceiling, and is a hard
# throttle for anything scripted.
limit_req_zone $binary_remote_addr zone=llm:10m rate=20r/m;
limit_req_status 429;

server {
    listen 16001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 2.4 kB is a full eight-turn conversation at its longest. This is
    # seven times that, and small enough that nobody is filling the context
    # window from the outside.
    client_max_body_size 16k;

    # Shared by the /v1 locations below. Inherited, so each location needs
    # only its own proxy_pass.
    proxy_http_version 1.1;
    # Buffering here would defeat streaming -- though at ten characters per
    # second the paper is a far tighter bottleneck than the network.
    proxy_buffering    off;
    proxy_cache        off;
    proxy_set_header   Connection '';
    proxy_set_header   Host $host;
    # A 0.6B model on a small CPU box is not fast to first token, but it is
    # not slow either: a capped reply lands in a few seconds. 300s only ever
    # served to hold a connection open for a runaway request.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- The LLM: an allowlist, not a prefix ---------------------------
    #
    # llama-server also serves /v1/completions -- raw generation with no
    # chat template, which is the convenient way to ignore the system
    # prompt entirely -- and /v1/embeddings. This application calls neither.
    # Proxying /v1/ as a prefix would publish both, and every endpoint added
    # by a future llama.cpp release along with them.

    location = /v1/models {
        proxy_pass http://llm:16002/v1/models;
    }

    location = /v1/chat/completions {
        limit_req zone=llm burst=5 nodelay;
        proxy_pass http://llm:16002/v1/chat/completions;
    }

    # Everything else under /v1 does not exist as far as the internet is
    # concerned.
    location /v1/ {
        return 404;
    }
}
